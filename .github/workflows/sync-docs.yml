name: Sync docs to WordPress

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/scripts/sync-docs.php'
  workflow_dispatch: {}

env:
  SSH_HOST: ssh.salesbystate.com
  SSH_PORT: 18765
  SSH_USER: u567-drj4rf5c7qzt
  SSH_KEY: /home/rodolfomelogli/.ssh/salesbystate_siteground
  REMOTE_WP_PATH: /home/u567-drj4rf5c7qzt/www/salesbystate.com/public_html

jobs:
  sync:
    # Runs on the self-hosted runner registered on this machine - SiteGround
    # blocks GitHub-hosted runner IPs for both the REST API and SSH, so this
    # job needs to execute from a known IP instead.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy docs and sync script to server
        run: |
          REMOTE_TMP="/tmp/sbs-docs-sync-${{ github.run_id }}"
          ssh -p "$SSH_PORT" -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_TMP"
          scp -P "$SSH_PORT" -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new -r docs "$SSH_USER@$SSH_HOST:$REMOTE_TMP/docs"
          scp -P "$SSH_PORT" -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new .github/scripts/sync-docs.php "$SSH_USER@$SSH_HOST:$REMOTE_TMP/sync-docs.php"
          echo "REMOTE_TMP=$REMOTE_TMP" >> "$GITHUB_ENV"

      - name: Run sync on the server
        run: |
          ssh -p "$SSH_PORT" -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "cd $REMOTE_WP_PATH && wp eval-file $REMOTE_TMP/sync-docs.php && (wp sg purge >/dev/null 2>&1 || true)"

      - name: Clean up remote temp files
        if: always()
        run: |
          ssh -p "$SSH_PORT" -i "$SSH_KEY" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "rm -rf $REMOTE_TMP"
